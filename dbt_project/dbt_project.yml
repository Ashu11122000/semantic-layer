# Project name must contain only lowercase letters, digits, and underscores.
name: "semantic_layer_project"
version: "1.0.0"
config-version: 2

# PostgreSQL adapter
profile: "semantic_layer_project"

# Project directories
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Default model configurations
models:
  semantic_layer_project:
    staging:
      +materialized: view
      +schema: staging

    intermediate:
      +materialized: view
      +schema: intermediate

    marts:
      +materialized: table
      +schema: marts